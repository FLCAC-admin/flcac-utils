# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  # push:
  #   branches: [ "main" ]
  #   paths-ignore:               # prevents workflow execution when only these types of files are modified
  #     - '**.md'                 # wildcards prevent file in any repo dir from trigering workflow
  #     - '**.ya?ml'              # captures both .yml and .yaml
  #     - 'LICENSE'
  #     - '.gitignore'
  #     - '**.bib'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:            # also allow manual trigger, for testing purposes


jobs:
  # Runs in parallel with `test` so pytest still runs if Ruff fails (no early exit in one job).
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Install package and dev tools
      run: |
        pip install ".[dev]"
    - name: Lint and format check (ruff)
      run: |
        ruff format --check flcac_utils tests
        ruff check flcac_utils tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    # install package, dev tools (pytest), and runtime deps
    - name: Install package and dependencies
      run: |
        pip install ".[dev]"

    - name: Test with pytest
      run: |
        pytest
