[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [
    ".venv",
    "build",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["flcac_utils"]
